<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:#0f172a;

color:white;

padding:20px;

}


.player{

width:100%;
max-width:420px;

background:#1e293b;

padding:25px;

border-radius:25px;

text-align:center;

}


.logo{

width:220px;
height:220px;

object-fit:cover;

border-radius:20px;

}


h1{

font-size:24px;

margin:20px 0 5px;

}


.artist{

color:#94a3b8;

}


audio{

width:100%;

margin-top:20px;

}


button{

border:none;

background:#facc15;

padding:12px 20px;

border-radius:30px;

font-size:20px;

margin:15px 5px 0;

}


.status{

margin-top:15px;

font-size:13px;

color:#94a3b8;

}

</style>

</head>


<body>


<div class="player">


<img id="cover" class="logo" src="logo.png">


<h1 id="title">
Memuat playlist...
</h1>


<p id="artist" class="artist">
Sedatur Music Hub
</p>



<audio id="audio" controls></audio>



<div>

<button onclick="previousSong()">
⏮
</button>


<button onclick="nextSong()">
⏭
</button>

</div>


<div id="status" class="status">
Menghubungkan playlist...
</div>


</div>



<script>


let playlist=[];

let current=0;



const audio=document.getElementById("audio");

const cover=document.getElementById("cover");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const status=document.getElementById("status");




// LOAD PLAYLIST


fetch("playlist.json")

.then(response=>{


if(!response.ok){

throw new Error("playlist.json tidak ditemukan");

}


return response.json();


})


.then(data=>{


playlist=data;


status.innerHTML="Playlist siap";


loadSong();


})


.catch(error=>{


title.innerHTML="Playlist Error";

status.innerHTML=error.message;


});







function loadSong(){


let song=playlist[current];


audio.src=song.file;


cover.src=song.cover;


title.innerHTML=song.title;


artist.innerHTML=song.artist;


updateMedia();


}







function nextSong(){


current++;


if(current>=playlist.length){

current=0;

}


loadSong();


audio.play();


}






function previousSong(){


current--;


if(current<0){

current=playlist.length-1;

}


loadSong();


audio.play();


}






audio.onended=function(){

nextSong();

};







// BACKGROUND CONTROL


function updateMedia(){


if(!("mediaSession" in navigator)){

return;

}



navigator.mediaSession.metadata=
new MediaMetadata({

title:playlist[current].title,

artist:playlist[current].artist,

album:"Sedatur Music Hub",

artwork:[

{

src:playlist[current].cover,

sizes:"512x512",

type:"image/png"

}

]

});





navigator.mediaSession.setActionHandler(
"nexttrack",
nextSong
);



navigator.mediaSession.setActionHandler(
"previoustrack",
previousSong
);



navigator.mediaSession.setActionHandler(
"play",
()=>audio.play()
);



navigator.mediaSession.setActionHandler(
"pause",
()=>audio.pause()
);



}



</script>


</body>

</html>
