<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedatur Music</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:linear-gradient(160deg,#050505,#1b1b1b,#111);
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.player{
width:95%;
max-width:420px;
background:#181818;
border-radius:25px;
padding:25px;
box-shadow:0 20px 50px #000;
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.cover{
width:100%;
aspect-ratio:1;
border-radius:20px;
background:#333;
object-fit:cover;
}

h2{
margin:20px 0 5px;
}

.artist{
color:#aaa;
}

audio{
display:none;
}

.progress{
width:100%;
}

.time{
display:flex;
justify-content:space-between;
font-size:12px;
color:#aaa;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin:20px 0;
}

button{
border:none;
background:#1db954;
color:white;
width:55px;
height:55px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.small{
background:#333;
}

.volume{
width:100%;
}

.playlist{
margin-top:20px;
max-height:220px;
overflow:auto;
}

.song{
padding:12px;
border-radius:12px;
cursor:pointer;
display:flex;
gap:10px;
}

.song:hover{
background:#ffffff15;
}

.active{
background:#1db95433;
}
</style>

</head>

<body>

<div class="player">

<div class="logo">
🎧 Sedatur Music
</div>

<img id="cover" class="cover"
src="https://via.placeholder.com/500">

<h2 id="title">Loading...</h2>
<div id="artist" class="artist">Sedatur</div>

<audio id="audio"></audio>

<input id="progress"
class="progress"
type="range"
value="0">

<div class="time">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>


<div class="controls">

<button class="small" onclick="prev()">⏮</button>

<button onclick="playPause()" id="play">
▶️
</button>

<button class="small" onclick="next()">⏭</button>

</div>


🔊
<input id="volume"
class="volume"
type="range"
min="0"
max="1"
step="0.1"
value="1">


<h3>Playlist</h3>

<div id="playlist" class="playlist"></div>


</div>


<script>

let songs=[];
let index=0;

const audio=document.getElementById("audio");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const playlist=document.getElementById("playlist");
const progress=document.getElementById("progress");
const play=document.getElementById("play");


fetch("playlist.json")
.then(res=>res.json())
.then(data=>{
songs=data;
loadSong();
});


function loadSong(){

let song=songs[index];

audio.src=song.file;
title.innerHTML=song.title;
artist.innerHTML=song.artist;

render();

}


function playPause(){

if(audio.paused){
audio.play();
play.innerHTML="⏸";
}else{
audio.pause();
play.innerHTML="▶️";
}

}


function next(){

index++;

if(index>=songs.length)
index=0;

loadSong();
audio.play();

}


function prev(){

index--;

if(index<0)
index=songs.length-1;

loadSong();
audio.play();

}


audio.addEventListener("timeupdate",()=>{

progress.value=(audio.currentTime/audio.duration)*100 || 0;

document.getElementById("current").innerHTML=
format(audio.currentTime);

document.getElementById("duration").innerHTML=
format(audio.duration);

});


progress.oninput=function(){

audio.currentTime=
(this.value/100)*audio.duration;

}


document.getElementById("volume")
.oninput=function(){

audio.volume=this.value;

}


function format(sec){

if(isNaN(sec)) return "0:00";

let m=Math.floor(sec/60);
let s=Math.floor(sec%60);

if(s<10)s="0"+s;

return m+":"+s;

}


function render(){

playlist.innerHTML="";

songs.forEach((song,i)=>{

let div=document.createElement("div");

div.className="song";

if(i==index)
div.classList.add("active");

div.innerHTML=
"🎵 "+song.title+
"<br><small>"+song.artist+"</small>";


div.onclick=()=>{

index=i;
loadSong();
audio.play();

};


playlist.appendChild(div);

});

}


</script>

</body>
</html>
